services:
  postgres:
    image: postgres:16-alpine
    container_name: flowlens-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowlens
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowlens"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: flowlens-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  control-plane:
    build:
      context: .
      dockerfile: ./apps/control-plane/Dockerfile
    container_name: flowlens-control-plane
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/flowlens
      DB_SCHEMA: mapper
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  dashboard:
    build:
      context: .
      dockerfile: ./apps/dashboard/Dockerfile
    container_name: flowlens-dashboard
    environment:
      PORT: 3000
      VITE_API_BASE_URL: http://localhost:4000/api/v1
    depends_on:
      control-plane:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
